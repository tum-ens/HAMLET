[pytest]
testpaths = tests
# e2e runs the whole example and takes minutes; select it explicitly with -m e2e
addopts = -m "not e2e and not golden and not benchmark" --strict-markers
markers =
    solver: builds and solves a real optimisation model (needs HiGHS)
    e2e: runs the shipped example end to end (minutes, deselected by default)
    golden: compares the shipped example against committed reference numbers (minutes, deselected by default)
    benchmark: times the modelling backends against each other (~30 s, deselected by default; run with -m benchmark -s)
# An empty `parametrize` argument is an error, not a skip. pytest's default turns one into a
# silent skip, which makes every parametrised test in the suite passable by omission: emptying the
# list it draws its cases from removes the test and leaves the run green. Demonstrated on
# `IMPLEMENTED` and `NESTED` by a review panel, and this repository has already lost a session to
# three allowlist constants that each passed the same way.
empty_parameter_set_mark = fail_at_collect
# No `filterwarnings` here on purpose: `tests/conftest.py:pytest_configure` registers
# `hamlet.warning_policy.SUPPRESSED`, so the suite and the runtime cannot disagree (#199).
