[pytest]
testpaths = tests
# e2e runs the whole example and takes minutes; select it explicitly with -m e2e
addopts = -m "not e2e and not golden and not benchmark" --strict-markers
markers =
    solver: builds and solves a real optimisation model (needs HiGHS)
    e2e: runs the shipped example end to end (minutes, deselected by default)
    golden: compares the shipped example against committed reference numbers (minutes, deselected by default)
    benchmark: times the modelling backends against each other (~30 s, deselected by default; run with -m benchmark -s)
# The suppression list itself lives in `hamlet.warning_policy.SUPPRESSED` and is registered
# by `tests/conftest.py:pytest_configure`, so the suite and the runtime cannot disagree.
# This section previously read `ignore::DeprecationWarning`, which hid every deprecation in
# the suite -- the same blanket suppression as issue #199, one layer out.
