# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    # Replaces the old `python.install: - requirements: docs/requirements.txt`. That file was a
    # second, unpinned dependency list, which is the thing this repository has one of now: the
    # `docs` group in `pyproject.toml`, resolved through the committed `uv.lock`.
    #
    # HAMLET itself is deliberately NOT installed here. There is not a single `automodule` /
    # `autoclass` / `autosummary` directive under `docs/source/`, so Sphinx never imports the
    # package and installing it would pull pandapower, sktime and matplotlib onto the docs builder
    # for nothing.
    #
    # `--python` is spelled out because Read the Docs documents `READTHEDOCS_VIRTUALENV_PATH` but
    # does not document activating the virtualenv for `build.jobs` commands, so uv must not be
    # left to guess which interpreter it is installing into.
    install:
      - pip install uv==0.12.2
      - uv pip install --python "${READTHEDOCS_VIRTUALENV_PATH}/bin/python" --group docs

# Build documentation in the "docs/" directory with Sphinx
sphinx:
   configuration: docs/source/conf.py
